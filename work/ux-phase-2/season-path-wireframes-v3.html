padding:5px 8px;font-size:14px}.fixture-label{font-size:13px;padding:8px 16px;background:#f3f3f3;border-bottom:1px dashed #aaa}.app-body{padding:24px 18px}.app-foot{padding:12px 18px;border-top:1px solid #999;display:flex;gap:10px;justify-content:space-between}.notice{margin:10px 18px;padding:12px;border:2px solid #333;background:#eee}.eyebrow{font-size:.85rem;color:#444;margin-bottom:8px}.audio{display:flex;gap:12px;margin:18px 0}.audio button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:98px;min-width:104px;font-size:1.1rem;font-weight:bold}.audio svg{width:42px;height:42px;margin-bottom:4px}.transcript,.voice-panel:not(:empty){border-inline-start:4px solid #555;background:#f3f3f3;padding:14px;margin-bottom:18px}.crop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.crop{min-height:164px}.crop strong,.crop small{display:block}.crop-art{width:100px;height:85px;display:block;margin:auto}.crop .selection{font-size:14px}.mini-path{padding:12px 12px 16px;border-bottom:1px solid #999}.mini-path ol{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));list-style:none;margin:0;padding:0;gap:6px}.mini-path button{width:100%;padding:7px 2px;min-height:98px;font-size:12px;line-height:1.4;position:relative}.mini-path .crop-art{height:35px;width:45px}.mini-path li:not(:last-child){border-inline-end:2px dotted #888;padding-inline-end:6px}.mini-path [aria-current=step]{border:3px solid #222}.mini-path .mark{display:block;font-weight:bold}.path-summary{display:flex;justify-content:space-between;font-size:13px;padding:0 2px 8px}.box{padding:16px;border:1px solid #999;margin:12px 0}.status{border:2px solid #444;padding:14px;margin:12px 0}.status strong{display:block}.status.review-state{border-style:dashed}.status.unknown{background:#f3f3f3;border-style:dotted}.status.saved{border-width:1px;border-inline-start:6px double #444}.status.feasible{border:4px double #444}.lock{font-size:14px;font-weight:bold;border:1px solid #555;padding:3px 7px;display:inline-block;margin:4px 0}.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dates label{margin:0;font-size:15px}.dates select{padding:7px}.season-list{padding-inline-start:26px}.season-list>li{padding:8px 0 18px;border-bottom:1px dashed #aaa}.path-crop{display:flex;gap:12px;align-items:center}.path-crop .crop-art{margin:0;width:52px;height:60px}.field-conflict{border:2px solid #444;padding:14px;margin:16px 0;background:repeating-linear-gradient(135deg,#fff,#fff 10px,#eee 10px,#eee 12px)}.field-conflict .box{background:white}.field-conflict .row{justify-content:space-around}.calendar{width:100%;height:auto}.graph{min-height:180px;border-inline-start:2px solid #555;border-bottom:2px solid #555;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(0deg,#fff,#fff 39px,#ddd 40px);padding:18px;text-align:center}.metric-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.day-list{list-style:none;padding:0}.day-list li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #bbb;padding:14px 0;font-size:.9rem}.day-list b{display:block}.welcome-crops{display:flex;justify-content:space-around;gap:8px;padding:24px 0;border-bottom:3px dotted #777;margin-bottom:24px}.welcome-crops .crop-art{width:65px}.help{background:#f3f3f3;padding:14px}.steps{padding-inline-start:24px}.steps li{margin:10px 0}.split>section{min-width:0}.tools-links{margin-top:22px;border-top:1px solid #aaa}.tools-links button{display:block;width:100%;text-align:start;margin:8px 0}.mono{direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;font-family:monospace;font-size:.85rem}.state-grid{display:grid;gap:10px}.switch-note{font-size:14px}a{color:#222}h2:focus{outline:0}@media(min-width:850px){.desktop .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px}.desktop .app-body{padding:38px}.desktop .mini-path{padding:16px 38px}.desktop .mini-path button{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;min-height:72px}.desktop .crop{min-height:185px}.desktop .state-grid{grid-template-columns:1fr 1fr}}@media(max-width:360px){.app-body{padding:18px 12px}.audio button{min-width:90px}.mini-path button{font-size:11px}.dates{gap:4px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body><div id="season-wireframes">
<aside class="review" dir="ltr" lang="en"><strong>SEASON PATH · WIREFRAME V3 · LOW FIDELITY</strong><div class="row"><button data-layout="mobile" aria-pressed="true">Mobile</button><button data-layout="desktop" aria-pressed="false">Desktop</button><a href="season-path-wireframes.html">Compare V2</a></div><details><summary>Reviewer controls · simulated states</summary><nav class="review-nav row" aria-label="Review views"></nav><label>Speech simulation<select id="voice-simulation"><option value="ready">Ready</option><option value="listening">Listening</option><option value="recognized">Recognized, unconfirmed</option><option value="unclear">Not understood / silence</option><option value="denied">Permission denied</option><option value="unavailable">Microphone unavailable</option><option value="audiofailed">Playback unavailable</option></select></label><div class="row"><button data-action="loadfail">Network failure example</button><button data-action="savefail">Save failure example</button><button data-action="states">Status meanings</button></div><p>All speech, checks and saving are simulations. No audio, microphone, network, storage or agronomic computation. Layout controls are outside the farmer interface.</p></details></aside>
<div class="stage"><article class="phone"><header class="app-head"></header><div class="fixture-label"></div><nav class="mini-path"></nav><main class="app-body"></main><div class="notice" role="status" hidden></div><footer class="app-foot"></footer></article></div>

<script>
(()=>{'use strict';
const root=document.getElementById('season-wireframes'),body=root.querySelector('.app-body');
let locale='ar',page='welcome',season=0,step='crop',history=[],voice='ready',playing=false,section=0,metric='temperature',outlook='unavailable',candidate='2027-05-28',pending=null,editor=null,help=false;
const t=(ar,en)=>locale==='ar'?ar:en;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=[['برسيم','Berseem'],['ذرة حبوب','Grain maize'],['قمح حبوب','Grain wheat'],['ذرة رفيعة حبوب','Grain sorghum']];
const cropName=i=>i===null?t('لسه مش معروف','Not known yet'):t(...names[i]);
const num=n=>locale==='ar'?String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):String(n);
const date=v=>v?new Intl.DateTimeFormat(locale==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z')):t('لسه مش معروف','Not known yet');
const btn=(ar,en,action,cls='secondary')=>`<button class="${cls}" data-action="${action}">${t(ar,en)}</button>`;
const detail=(ar,en,content)=>`<details><summary>${t(ar,en)}</summary>${content}</details>`;
const status=(kind,ar,en,more='')=>`<div class="status ${kind}"><strong>${t(ar,en)}</strong>${more?`<p>${more}</p>`:''}</div>`;
const icon=name=>`<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${name==='speaker'?'<path d="M6 19h9L27 9v30L15 29H6z"/><path d="M33 16q10 8 0 16M38 10q16 14 0 28"/>':'<rect x="18" y="5" width="12" height="25" rx="6"/><path d="M11 23v3a13 13 0 0 0 26 0v-3M24 39v5M17 44h14"/>'}</svg>`;
function photo(i){let shape=i===null?'<text x="50" y="58" text-anchor="middle" font-size="42">?</text>':i===0?'<path d="M50 74V36M50 54L30 36M50 60l20-22"/><g fill="#ddd"><ellipse cx="25" cy="26" rx="13" ry="9"/><ellipse cx="43" cy="25" rx="10" ry="13"/><ellipse cx="29" cy="40" rx="12" ry="8"/><ellipse cx="67" cy="26" rx="12" ry="8"/><ellipse cx="78" cy="39" rx="9" ry="12"/></g>':i===1?'<path d="M50 76V12M50 44Q15 16 20 40Q30 51 50 54M50 63q40-34 31-14q-14 20-31 20"/><ellipse cx="56" cy="41" rx="9" ry="19" fill="#ddd"/><path d="M52 25v30M59 26v29M48 35h15M48 43h15"/>':i===2?'<path d="M50 78V14M50 65L30 45M50 58l20-16"/><g fill="#ddd">'+[18,29,40,51].map(y=>`<ellipse cx="43" cy="${y}" rx="6" ry="10" transform="rotate(-35 43 ${y})"/><ellipse cx="57" cy="${y}" rx="6" ry="10" transform="rotate(35 57 ${y})"/>`).join('')+'</g>':'<path d="M50 78V33M50 66q-22-28-31-20M50 58q18-24 29-18"/><g fill="#bbb">'+[0,1,2,3,4].map(r=>[0,1,2].map(c=>`<circle cx="${40+c*10}" cy="${12+r*8}" r="5"/>`).join('')).join('')+'</g>';return `<svg class="crop-art" viewBox="0 0 100 85" aria-hidden="true" fill="none" stroke="#444" stroke-width="2">${shape}</svg>`;}
function blank(){return {version:1,fixture:false,modified:false,confirmed:false,evaluated:false,result:null,saved:false,saveFailed:false,inspected:[],seasons:Array.from({length:4},()=>({crop:null,sow:null,end:null,release:null,cropLock:false,dateLock:false,visited:false})),area:null,prep:null,soil:null,water:null};}
let plan=blank();
function loadFixture(){plan=blank();plan.fixture=true;plan.area=1;plan.prep=7;plan.soil='clay';plan.water='irrigated';const sow=['2026-11-01','2027-05-15','2027-11-20','2028-06-01'],end=['2027-05-20','2027-09-20','2028-04-25','2028-09-21'],release=['2027-05-21','2027-09-21','2028-04-26','2028-09-22'];plan.seasons=names.map((_,i)=>({crop:i,sow:sow[i],end:end[i],release:release[i],cropLock:i===1||i===2,dateLock:i===0,visited:false}));season=0;step='crop';}
function invalidate(){plan.version++;plan.modified=true;plan.confirmed=false;plan.evaluated=false;plan.result=null;plan.saved=false;plan.saveFailed=false;playing=false;voice='ready';}
function notice(text){let n=root.querySelector('.notice');n.textContent=text;n.hidden=false;}
function ctx(){return {page,season,step,candidate};}
function go(next){history.push(ctx());page=next;playing=false;voice='ready';editor=null;pending=null;help=false;section=0;render(true);}
function back(){const prev=history.pop();if(prev){({page,season,step,candidate}=prev);}playing=false;voice='ready';editor=null;pending=null;help=false;render(true);}
function lock(s){return s.cropLock||s.dateLock?`<span class="lock">${t('ثابت باختيارك','Protected by your choice')} · ${s.cropLock?t('المحصول والغرض','Crop & purpose'):''}${s.dateLock?' '+date(s.end):''}</span>`:'';}
function path(){return `<div class="path-summary"><strong>${t('أرض واحدة · ٤ مواسم','One field · 4 seasons')}</strong><span>${t('اضغط للتعديل','Tap to edit')}</span></div><ol>${plan.seasons.map((s,i)=>`<li><button data-season="${i}" ${page==='plan'&&season===i?'aria-current="step"':''}>${photo(s.crop)}<span>${num(i+1)} · ${cropName(s.crop)}<span class="mark">${page==='plan'&&season===i?t('◉ دلوقتي','◉ Current'):s.visited?t('✓ اتراجع','✓ Reviewed'):t('○ باقي','○ Remaining')}${s.cropLock||s.dateLock?' · '+t('ثابت','Protected'):''}${plan.result==='rejected'&&i<2?' · '+t('× تعارض','× Conflict'):s.sow===null||s.end===null?' · ?':''}</span></span></button></li>`).join('')}</ol>`;}
function seasonLabel(i){return plan.fixture?t(['شتاء ٢٠٢٦/٢٧','صيف ٢٠٢٧','شتاء ٢٠٢٧/٢٨','صيف ٢٠٢٨'][i],['Winter 2026/27','Summer 2027','Winter 2027/28','Summer 2028'][i]):t('الموسم '+num(i+1)+' · السنة غير محددة','Season '+(i+1)+' · year unspecified');}
function allSeasons(){return `<ol class="season-list">${plan.seasons.map((s,i)=>`<li><div class="path-crop">${photo(s.crop)}<strong>${cropName(s.crop)}<small style="display:block">${seasonLabel(i)}</small></strong></div>${lock(s)}<details><summary>${t('المواعيد والتعديل','Dates and editing')}</summary><p>${t('زراعة','Sowing')}: ${date(s.sow)}<br>${t('حصاد / آخر حشة','Harvest / final cut')}: ${date(s.end)}<br>${t('خلو الأرض','Field release')}: ${date(s.release)} ${s.release?t('· مفترض','· assumed'):''}</p><button data-season="${i}">${t('عدّل الموسم','Edit season')} ${num(i+1)}</button></details></li>`).join('')}</ol>`;}
function unknowns(){return t('الملوحة، الحموضة، الصرف، منسوب المياه، مواعيد وكميات الري، كمية العلف ومراحل النمو لسه غير معروفة.','Salinity, pH, drainage, water table, irrigation delivery and volumes, feed quantity and crop stages remain unknown.');}
function contextDetails(editable=false){return `<p>${t('قطعة واحدة في سخا','One Sakha field')} · ${t('المساحة','Area')}: ${plan.area===null?t('غير معروفة','unknown'):num(plan.area)+' '+t('هكتار','hectares')} · ${t('التجهيز','Preparation')}: ${plan.prep===null?t('غير معروف','unknown'):num(plan.prep)+' '+t('أيام مفترضة','assumed days')}</p><p>${t('التربة','Soil')}: ${plan.soil==='clay'?t('طينية حسب المثال، بدون تحليل','clayey, fixture report without lab evidence'):t('غير معروفة','unknown')} · ${t('الري','Irrigation')}: ${plan.water==='irrigated'?t('معتمدة على الري، التوفر غير معروف','irrigation-dependent, availability unknown'):t('غير معروف','unknown')}</p><p>${unknowns()}</p>${editable?`<label>${t('المساحة بالهكتار — سيبها فاضية لو مش عارف','Area in hectares — leave blank if unknown')}<input data-context="area" type="number" min="0.01" step="0.01" value="${plan.area??''}"></label><label>${t('أيام التجهيز الكاملة — مش بنفترض صفر','Full preparation days — unknown is not zero')}<input data-context="prep" type="number" min="0" step="1" value="${plan.prep??''}"></label><label>${t('وصف التربة','Soil report')}<select data-context="soil"><option value="">${t('مش عارف','Unknown')}</option><option value="clay" ${plan.soil==='clay'?'selected':''}>${t('طينية — وصف غير متحقق','Clayey — unverified report')}</option></select></label><label>${t('نظام المياه','Water regime')}<select data-context="water"><option value="">${t('مش عارف','Unknown')}</option><option value="irrigated" ${plan.water==='irrigated'?'selected':''}>${t('أرض بتتروي — التوفر غير معروف','Irrigated — availability unknown')}</option></select></label>`:''}`;}
function engineer(){return detail('للمهندس: التفاصيل والمصادر','Engineer: precise details & sources',`${contextDetails()}<p>${t('الأصناف المرشحة في المثال فقط: سخا ٤ للبرسيم، هجين فردي ١٠ للذرة، جيزة ١٦٨ للقمح. صنف الذرة الرفيعة غير معروف. اختيار الصورة لا يثبت الصنف أو مناسبة الأرض.','Fixture profile candidates only: Sakha 4 berseem, Single Hybrid 10 maize, Giza 168 wheat. Sorghum cultivar unknown. A picture selection establishes neither cultivar nor field applicability.')}</p><p>${t('المراجع: سيناريو UH-001، أقسام ١–٤؛ تجربة أياد ٢٠١٩ ص ١٤٩–١٥٠؛ نشرة الذرة ١٤٢٩/٢٠٢٣ ص ٤–٥؛ FAO البرسيم المصري ص ٦٥–٦٨. التكرار في سنين جديدة افتراض وليس مدة نمو معتمدة.','Sources: UH-001 sections 1–4; Aiad 2019 pp.149–150; maize bulletin 1429/2023 pp.4–5; FAO Egyptian Clover pp.65–68. Repeating trial dates in later years is an assumption, not a validated duration.')}</p><p>${t('مؤشرات التسلسل: وجود البرسيم ظاهر؛ العائلات والجذور وفترات الخلو محتاجة مصادر ومدد مدعومة. مش بنحسب تحسن تربة أو نيتروجين.','Sequence indicators: berseem presence is visible; families, roots and crop-free intervals require sources and supported endpoints. No soil-health or nitrogen benefit is calculated.')}</p>${btn('عدّل بيانات الأرض','Edit field details','context','link')}`);}
function toolsLinks(){return `<div class="tools-links">${btn('طقس السنين اللي فاتت · NASA','Past weather · NASA','replay')}${btn('طقس الأيام الجاية · تجريبي','Next seven days · experimental','outlook')}</div>`;}
function resultStatus(){return plan.result==='rejected'?status('rejected','× الخطة فيها تعارض','× Plan rejected: timing conflict',t('نتيجة مثال عم حسين فقط، مش فحص مباشر.','Uncle Hussein fixture result only, not a live check.')):status('review-state','△ محتاجة مراجعة','△ Needs review',t('البيانات أو الأدلة ناقصة. مفيش فحص زراعي منفّذ للخطة دي.','Inputs or evidence are incomplete. No agricultural check has run for this plan.'));}
function scripts(){const s=plan.seasons[season];const common=t(`نسخة المسودة ${num(plan.version)}. `,`Draft version ${plan.version}. `);if(page==='inspect'&&(!plan.fixture||plan.modified))return [common+t('المراجعة القديمة مش حالية. نحتفظ بالمدخلات الجديدة كمسودة للمراجعة.','The previous investigation is no longer current. Retain the updated input as a review draft.')];if(pending)return [t(`التغيير المقترح في الموسم ${num(season+1)}: من ${pendingLabel(false)} إلى ${pendingLabel(true)}. التزام ثابت هيتغير باختيارك. باقي الالتزامات تفضل.`,`Proposed season ${season+1} change: ${pendingLabel(false)} to ${pendingLabel(true)}. You are changing a protected commitment; other commitments remain.`)];if(editor)return [t('اختار اليوم والشهر والسنة. التاريخ مش هيتسجل غير لما تضغط استخدم التاريخ.','Choose the day, month and year. The date is not applied until you choose Use date.')];if(page==='welcome')return [t('أرضك، مواسمك، قرارك. نرتب أربع مواسم ونحافظ على اللي يهمك. دوس نبدأ، واختار الصور أو جاوب بصوتك. ده نموذج للتصميم، الصوت هنا محاكاة.','Your land, your seasons, your decision. Arrange four seasons while protecting what matters. Tap Start, choose pictures or speak. This is a design prototype; audio is simulated.')];if(page==='plan')return [step==='crop'?t(`الموسم ${num(season+1)}. عايز تزرع إيه؟ اختار صورة، أو جاوب. لو مش عارف، قول مش عارف.`,`Season ${season+1}. What would you like to grow? Choose a picture or speak. You may say you do not know.`):t(`${cropName(s.crop)}. زراعة ${date(s.sow)}. آخر حصاد أو حشة ${date(s.end)}. لو في محصول أو حشة لازم تفضل، ثبّتها. تقدر تكمل بالمعلومات المجهولة.`,`${cropName(s.crop)}. Sowing ${date(s.sow)}. Harvest or final cut ${date(s.end)}. Protect an essential crop or cut, or continue with unknown dates.`)];if(page==='context')return [t('عندك معلومات عن الأرض؟ لو مش عارف، هنسيبها مجهولة. مش هنستخدم قياسات مزرعة تانية.','Do you know your field details? If not, we keep them unknown. We will not use another farm’s measurements.')];if(page==='confirm')return plan.seasons.map((s,i)=>t(`الموسم ${num(i+1)}: ${cropName(s.crop)}. زراعة ${date(s.sow)}، حصاد أو حشة ${date(s.end)}. ${s.dateLock?'الحشة ثابتة باختيارك.':''} ${s.cropLock?'المحصول والغرض ثابتين.':''}`,`Season ${i+1}: ${cropName(s.crop)}. Sowing ${date(s.sow)}, harvest or cut ${date(s.end)}. ${s.dateLock?'The cut is protected.':''} ${s.cropLock?'Crop and purpose are protected.':''}`)).concat([t(`قطعة واحدة. المساحة ${plan.area===null?'غير معروفة':num(plan.area)+' هكتار'}. التجهيز ${plan.prep===null?'غير معروف':num(plan.prep)+' أيام مفترضة'}. ${unknowns()} تأكيدك للمعلومات مش موافقة على الزراعة.`,`One field. Area ${plan.area===null?'unknown':plan.area+' hectares'}. Preparation ${plan.prep===null?'unknown':plan.prep+' assumed days'}. ${unknowns()} Confirming input is not planting approval.`)]);if(page==='result')return plan.result==='rejected'?[t('الذرة يوم خمستاشر مايو ٢٠٢٧ قبل حشة البرسيم يوم عشرين مايو ٢٠٢٧. نفس الأرض لسه مش فاضية. مش هنلغي الحشة.','Maize on 15 May 2027 precedes the protected berseem cut on 20 May 2027. The same field is still occupied. We keep the cut.'),t('مفيش بديل مؤكد. ٢٨ مايو و١ يونيو مواعيد للمراجعة الزراعية فقط. تقدر تحتفظ بالخطة كمسودة.','There are zero validated alternatives. 28 May and 1 June are investigations requiring agricultural review. You can retain the plan as a review draft.')]:[common+t('مفيش نتيجة فحص جديدة. المعلومات الناقصة تفضل مجهولة. تقدر تحتفظ بالمسودة للمراجعة.','No new check result is available. Missing information stays unknown. You can keep a review draft.')];if(page==='inspect')return [t(`بتشوف ميعاد ${date(candidate)}، مش بتغير خطتك. الحشة والمحاصيل الثابتة هتفضل. الحصاد وخلو الأرض بعد تغيير الزراعة غير معروفين.`,`You are inspecting ${date(candidate)}, without changing your plan. Protected cuts and crops remain. Harvest and release after changed sowing are unknown.`)];if(page==='replay')return [t('دي بيانات طقس سخا من السنين اللي فاتت، ٢٠٠١ لحد ٢٠٢٥. مش توقع للمستقبل. نقدر نفهم الحرارة وطلب الجو للمياه، مش كمية الري. الأرقام مش موصلة في النموذج ده.','This is Sakha historical weather, 2001–2025, not a forecast. It can describe temperature and atmospheric water demand, not irrigation quantities. Values are not connected in this wireframe.')];if(page==='outlook')return [t('طقس الأيام الجاية تجربة منفصلة. مفيش توقع حالي متاح. البيانات المحفوظة بتنتهي في أكتوبر ٢٠٢٦. مش بتحدد زراعة مايو ٢٠٢٧، ومش دليل إن الخطة تنفع.','The next-seven-day outlook is a separate experiment. No current forecast is available. Saved inputs end in October 2026. It cannot guide May 2027 sowing or validate a plan.')];return [common+t(`${plan.confirmed?'المدخلات متأكدة منك.':'المدخلات لسه محتاجة تأكيد.'} ${plan.result==='rejected'?'الخطة فيها تعارض.':'الخطة محتاجة مراجعة، بدون نتيجة فحص جديدة.'} ${plan.saved?'معاينة حفظ ناجح فقط.':'المسودة لسه مش محفوظة.'} الحفظ مش موافقة على الزراعة.`,`${plan.confirmed?'You confirmed the input.':'Input awaits confirmation.'} ${plan.result==='rejected'?'The plan is rejected for conflict.':'The plan needs review, without a new check result.'} ${plan.saved?'Simulated save success only.':'Draft not saved.'} Saving is not planting approval.`)];}
function audio(input=false){let voiceText='';if(voice==='listening')voiceText=`<strong>${t('بسمعك · محاكاة','Listening · simulation')}</strong>${btn('وقف الاستماع','Stop listening','stopvoice')}${btn('اعرض إجابة تجريبية','Show simulated response','recognized','link')}`;if(voice==='recognized')voiceText=`<strong>${t('سمعنا كده؟ لسه مش مؤكد','Is this what you meant? Unconfirmed')}</strong><p>${page==='plan'&&step==='crop'?cropName(0):t('«عشرين مايو» — السنة مش واضحة','“Twenty May” — year unclear')}</p>${page==='plan'&&step==='crop'?btn('استخدم كاختيار مبدئي','Use as proposed choice','proposal'):btn('حدد التاريخ كامل','Choose the full date','dateproposal')}${btn('لأ، أصحّح','No, correct it','correctvoice','link')}`;if(['unclear','denied','unavailable','audiofailed'].includes(voice))voiceText=`<strong>${({unclear:t('مش واضح. مفيش إجابة اتسجلت','Not understood. No answer recorded'),denied:t('الميكروفون مرفوض الإذن','Microphone permission denied'),unavailable:t('الميكروفون مش متاح','Microphone unavailable'),audiofailed:t('الصوت مش شغال','Audio unavailable')})[voice]}</strong><p>${t('اختار الصور أو الأزرار. إجاباتك لسه موجودة.','Use the pictures or buttons. Your answers are retained.')}</p>${btn('كمّل باللمس','Continue by touch','correctvoice')}`;const chunks=scripts();return `<div class="audio"><button data-action="listen" aria-expanded="${playing}">${icon('speaker')}<span>${t('اسمع','Listen')}</span></button>${input?`<button data-action="speak">${icon('mic')}<span>${t(page==='confirm'?'اتكلم':'جاوب','Speak')}</span></button>`:''}</div><div class="voice-panel" role="status">${voiceText}</div>${playing?`<div class="transcript"><strong>${t('تشغيل محاكاة — مفيش صوت فعلي','Simulated playback — no actual audio')}</strong><p>${chunks[Math.min(section,chunks.length-1)]}</p>${chunks.length>1?`<p>${num(section+1)} / ${num(chunks.length)}</p>${btn('الجزء اللي بعده','Next section','nextaudio','link')}${detail('الملخص الكامل عند الطلب','Full readback on request',chunks.map(x=>`<p>${x}</p>`).join(''))}`:''}${btn('وقف / اقفل النص','Stop / close transcript','stopaudio','link')}</div>`:''}`;}
function welcome(){return `<div class="split"><section><div class="eyebrow">${t('أهلًا بيك في سكة المواسم','Welcome to the Season Path')}</div><h2>${t('أرضك، مواسمك، قرارك','Your land. Your seasons. Your decision.')}</h2><p>${t('نرتّب أربع مواسم، ونحافظ على اللي يهمك.','Arrange four seasons while protecting what matters to you.')}</p>${btn('نبدأ','Start','start','primary')}${audio()}</section><section><div class="welcome-crops" aria-hidden="true">${names.map((_,i)=>photo(i)).join('')}</div><p class="small">${t('اختار الصور أو جاوب بصوتك. مفيش كتابة مطلوبة.','Choose pictures or speak. No typing required.')}</p>${detail('جرّب حكاية عم حسين','Try Uncle Hussein’s story',`<p>${t('مثال جاهز بمواعيد توضيحية، مش توصية. هتراجع المعلومات قبل تأكيدها.','A prefilled illustrative story, not a recommendation. Review its inputs before confirming.')}</p>${btn('افتح المثال وراجعه','Open and review fixture','fixture')}`)}</section></div>`;}
function dateEditor(){const months=Array.from({length:12},(_,i)=>new Intl.DateTimeFormat(locale==='ar'?'ar-EG':'en',{month:'long',timeZone:'UTC'}).format(new Date(Date.UTC(2027,i,1))));const opts=(values,current)=>`<option value="">${t('اختار','Choose')}</option>`+values.map(([v,l])=>`<option value="${v}" ${String(v)===String(current)?'selected':''}>${l}</option>`).join('');return `<fieldset><legend>${editor.field==='sow'?t('ميعاد الزراعة','Sowing date'):t('الحصاد أو آخر حشة','Harvest or final cut')}</legend><div class="dates"><label>${t('اليوم','Day')}<select data-datepart="day">${opts(Array.from({length:31},(_,i)=>[i+1,num(i+1)]),editor.day)}</select></label><label>${t('الشهر','Month')}<select data-datepart="month">${opts(months.map((m,i)=>[i+1,m]),editor.month)}</select></label><label>${t('السنة','Year')}<select data-datepart="year">${opts([2026,2027,2028,2029,2030].map(v=>[v,num(v)]),editor.year)}</select></label></div>${detail('اكتب التاريخ بدل الاختيارات','Type the date instead',`<label>${t('تاريخ كامل','Full date')}<input data-typeddate type="date" value="${editor.iso||''}"></label>`)}${btn('استخدم التاريخ','Use date','applydate','primary')}${btn('سيبه غير معروف','Keep unknown','unknowndate')}${btn('إلغاء التعديل','Cancel edit','canceleditor','link')}</fieldset>`;}
function pendingLabel(next){const value=next?pending.value:plan.seasons[season][pending.field];return pending.field==='crop'?cropName(value):pending.field==='end'?date(value):value?t('ثابت','Protected'):t('غير ثابت','Unprotected');}
function pendingView(){return status('review-state','تغيير التزام ثابت','Changing a protected commitment',`${t('من','From')}: ${esc(pendingLabel(false))}<br>${t('إلى','To')}: ${esc(pendingLabel(true))}<br>${t('ده اختيارك الصريح. النتيجة القديمة والحفظ مش هيبقوا حاليين.','This requires your explicit choice. Previous results and saved status will no longer be current.')}`)+btn('أنا موافق على تغيير الالتزام','I confirm this commitment change','applyprotected','primary')+btn('خلي الالتزام زي ما هو','Keep the existing commitment','cancelprotected');}
function planning(){const s=plan.seasons[season];let content;if(pending)content=pendingView();else if(editor)content=dateEditor();else if(step==='crop')content=`<div class="crop-grid">${names.map((_,i)=>`<button class="crop" data-crop="${i}" aria-pressed="${s.crop===i}">${photo(i)}<strong>${cropName(i)}</strong><small>${i===0?t('علف للمواشي','Livestock forage'):t('للحبوب','For grain')}</small><span class="selection">${s.crop===i?t('✓ مختار','✓ Selected'):t('اختار','Choose')}</span></button>`).join('')}</div>${btn('كمّل','Continue','cropnext','primary')}${btn('لسه مش عارف','I don’t know yet','unknowncrop','link')}<p class="small">${t('اختيار المحصول مش معناه إنه مناسب لأرضك. الرسومات للتصميم فقط.','Choosing a crop does not establish suitability. Drawings are schematic placeholders.')}</p>`;else content=`<div class="box"><div class="path-crop">${photo(s.crop)}<strong>${cropName(s.crop)}</strong></div>${lock(s)}<p>${t('زراعة','Sowing')}: ${date(s.sow)}</p>${btn('حدد أو عدّل الزراعة','Choose or edit sowing','sowdate','link')}<p>${t('آخر حشة / حصاد','Final cut / harvest')}: ${date(s.end)}</p>${btn('حدد أو عدّل الحشة / الحصاد','Choose or edit cut / harvest','enddate','link')}</div><fieldset><legend>${t('في حاجة لازم تفضل؟','Anything that must stay?')}</legend><button data-action="croplock" aria-pressed="${s.cropLock}">${s.cropLock?t('✓ المحصول والغرض ثابتين','✓ Crop and purpose protected'):t('ثبّت المحصول والغرض','Protect crop and purpose')}</button>${s.end?`<button class="secondary" data-action="datelock" aria-pressed="${s.dateLock}">${s.dateLock?t('✓ الحشة / الحصاد ثابت','✓ Cut / harvest protected'):t('ثبّت الحشة / الحصاد','Protect cut / harvest')}</button>`:''}<p class="small">${t('الثابت مايتغيّرش من غير موافقتك. ده مش ضمان للمحصول أو كفاية العلف. تقدر تكمل من غير تثبيت.','Protected means it cannot change without your consent. It does not guarantee yield or sufficient feed. You may continue without protection.')}</p></fieldset>${btn(season<3?'كمّل للموسم اللي بعده':'راجع معلومات الأرض',season<3?'Next season':'Review field context','seasonnext','primary')}`;return `<div class="split"><section><div class="eyebrow">${t('الموسم','Season')} ${num(season+1)} ${t('من ٤','of 4')} · ${t('اختيارات مبدئية','Proposed input')}</div><h2>${step==='crop'?t('عايز تزرع إيه؟','What would you like to grow?'):t('إيه المهم في الموسم ده؟','What matters this season?')}</h2>${audio(true)}<p class="small">${t('تغيير الموسم ممكن يأثر على اللي بعده. اضغط أي موسم فوق علشان ترجعله.','A change may affect later seasons. Tap any season above to return to it.')}</p></section><section>${content}</section></div>`;}
function contextView(){return `<div class="split"><section><h2>${t('نعرف إيه عن الأرض؟','What do we know about the field?')}</h2>${audio(true)}<p>${t('لو مش عارف، هنسيب المعلومة مجهولة.','If you don’t know, we keep it unknown.')}</p></section><section><div class="box"><p>${t('المساحة','Area')}: ${plan.area===null?t('غير معروفة','unknown'):num(plan.area)+' '+t('هكتار','hectares')}<br>${t('التجهيز','Preparation')}: ${plan.prep===null?t('غير معروف','unknown'):num(plan.prep)+' '+t('أيام مفترضة','assumed days')}</p><p>${t('تفاصيل التربة والري وكمية العلف محتاجة مراجعة.','Soil, irrigation and feed requirements need review.')}</p></div>${detail('عندي معلومات / أعدّل التفاصيل','I have details / edit precisely',contextDetails(true))}${btn('راجع اختياراتي والمجهول','Review my choices and unknowns','confirm','primary')}</section></div>`;}
function confirmation(){return `<div class="split"><section><h2>${t('دي اختياراتك؟','Are these your choices?')}</h2><p>${t('راجع أو اسمع موسم واحد كل مرة.','Review or listen to one season at a time.')}</p>${audio(true)}${btn('أكّد المعلومات والمجهول وشوف المراجعة','Confirm facts and unknowns; see review','confirmed','primary')}<p class="small">${t('ده تأكيد معلومات، مش تصريح بالزراعة.','This confirms input, not permission to plant.')}</p></section><section>${allSeasons()}${detail('الأرض والافتراضات والمجهول','Field, assumptions and unknowns',contextDetails())}${btn('عدّل بيانات الأرض','Edit field context','context','link')}</section></div>`;}
function calendar(){return `<svg class="calendar" viewBox="0 0 330 225" role="img" aria-label="${t('مايو ٢٠٢٧: ١٥ ذرة، ٢٠ حشة، ٢١ خلو مفترض، ٢٨ بعد سبعة أيام تجهيز','May 2027: maize 15, cut 20, assumed release 21, seven preparation days to 28')}"><defs><pattern id="hatch-v3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="2"/></pattern></defs><g font-family="Arial" font-size="15" fill="#222" text-anchor="middle"><text x="165" y="24">${t('مايو ٢٠٢٧ · مقياس أيام','May 2027 · day scale')}</text><path d="M30 70H290" stroke="#444"/><rect x="30" y="85" width="100" height="25" fill="url(#hatch-v3)" stroke="#555"/><rect x="150" y="150" width="140" height="25" fill="#ddd" stroke="#555"/><text x="30" y="60">${num(15)}</text><text x="130" y="60">${num(20)}</text><text x="150" y="137">${num(21)}</text><text x="290" y="137">${num(28)}</text><text x="80" y="128">${t('تعارض','Conflict')}</text><text x="220" y="199">${t('٧ أيام تجهيز مفترضة','7 assumed preparation days')}</text></g></svg>`;}
function promise(){return `<div class="split"><section><h2>${plan.result==='rejected'?t('نفس الأرض لسه مش فاضية','The same field is still occupied'):t('نحتفظ بالمجهول للمراجعة','Keep the unknowns for review')}</h2>${audio()}${resultStatus()}${plan.result==='rejected'?`<div class="field-conflict"><strong>${t('أرض واحدة · مايو ٢٠٢٧','One field · May 2027')}</strong><div class="row"><div class="box">${photo(1)}<b>${t('١٥ مايو · ذرة','15 May · maize')}</b></div><div class="box">${photo(0)}<b>${t('٢٠ مايو · حشة ثابتة','20 May · protected cut')}</b></div></div><p>${t('زراعة الذرة قبل حشة البرسيم. مش هنلغي الحشة.','Maize sowing comes before the berseem cut. We keep the cut.')}</p></div>${detail('ليه؟ شوف المواعيد والتجهيز','Why? Dates and preparation',calendar()+`<p>${t('خلو مفترض ٢١ مايو + ٧ أيام كاملة = ٢٨ مايو. حساب مواعيد، مش توصية زراعة. مفيش تعارض لاحق مثبت في المثال.','Assumed release 21 May + 7 full days = 28 May. Calendar arithmetic, not a planting recommendation. No later conflict is demonstrated in the fixture.')}</p>`)}`:`<p>${t('مفيش نتيجة فحص للمدخلات دي. أي تعديل يلغي النتائج السابقة. مفيش قواعد زراعية شغالة في النموذج.','No check result exists for these inputs. Edits invalidate prior results. This wireframe does not execute agricultural rules.')}</p>`}</section><section><div class="box"><h3>${t('مفيش بديل مؤكد لسه','No validated alternative yet')}</h3><p>${t('صفر بدائل ثبتت إمكانية تنفيذها هنا.','Zero agriculturally validated feasible alternatives here.')}</p>${plan.fixture&&!plan.modified?btn('شوف مواعيد للمراجعة','Inspect dates needing review','inspect'):t('لازم نستكمل الأدلة قبل اقتراح مواعيد.','More evidence is required before proposing dates.')}</div>${btn('كمّل لورقة المراجعة','Continue to Evidence Card','card','primary')}${engineer()}${toolsLinks()}</section></div>`;}
function investigation(){if(!plan.fixture||plan.modified)return staleInvestigation();return `<div class="split"><section><h2>${t('بتشوف بس، خطتك زي ما هي','Inspecting only; your plan is unchanged')}</h2>${audio()}${status('review-state','△ محتاج مراجعة زراعية','△ Needs agricultural review')}<div class="row">${['2027-05-28','2027-06-01'].map(d=>`<button data-candidate="${d}" aria-pressed="${candidate===d}">${date(d)}</button>`).join('')}</div><p>${t('الزراعة الأصلية لسه','Current sowing remains')} ${date(plan.seasons[1].sow)}</p></section><section><div class="box"><h3>${t('اللي هيفضل','Preserved')}</h3><p>${t('الحشة','Cut')} ${date(plan.seasons[0].end)} · ${t('ذرة وقمح حبوب ثابتين','Protected grain maize and wheat')}</p><h3>${t('التغيير المقترح','Proposed change')}</h3><p>${t('زراعة الذرة','Maize sowing')}: ${date(candidate)}</p></div>${status('unknown','؟ الحصاد وخلو الأرض مش معروفين','? Harvest and release unknown',t('المواسم اللي بعده محتاجة فحص جديد.','Later seasons need new checks.'))}${detail('ليه الميعاد مش توصية؟','Why is this not a recommendation?',`<p>${candidate==='2027-05-28'?t('متوافق حسابيًا مع فرضية التجهيز فقط. النضج والخلو ومناسبة الأرض مش مثبتين.','Calendar-compatible under the preparation assumption only. Maturity, release and field applicability are unresolved.'):t('الإرشاد الحالي بيفضل مايو؛ يونيو مش مستحيل تلقائيًا، لكن البديل غير مثبت.','Current guidance prefers May; June is not automatically impossible, but this repair is unvalidated.')}</p>`)}${btn('ارجع من غير تغيير','Return without changes','back','primary')}${detail('أغيّر مسودتي للميعاد ده','Change my draft to this date',`<p>${t('مش اعتماد. الحصاد والخلو يبقوا مجهولين والنتائج القديمة تتلغي.','Not approval. Harvest and release become unknown; old results are invalidated.')}</p>${btn('استخدم الميعاد في المسودة فقط','Use date in draft only','adopt')}`)}${toolsLinks()}</section></div>`;}
function staleInvestigation(){return "<h2>"+t("المراجعة دي مش حالية","This investigation is no longer current")+"</h2>"+audio()+status("unknown","المدخلات اتغيرت أو المثال مش مفتوح","Inputs changed or the fixture is not loaded")+btn("كمّل لورقة المراجعة","Continue to review draft","card","primary");}
function replay(){const labels={temperature:[t('نمط الحرارة','Temperature pattern'),t('أقصى حرارة يومية · °م','Daily maximum temperature · °C')],heat:[t('أيام الحرارة العالية','Hot-day exposure'),t('العتبة غير محددة؛ مفيش عدد أيام أو تصنيف خطر','Threshold unspecified; no count or crop-risk classification')],demand:[t('طلب الجو للمياه','Atmospheric water demand'),t('ET0 مرجعي · مم/يوم، مش كمية ري','Reference ET0 · mm/day, not irrigation')],variation:[t('اختلاف السنين','Variation across years'),t('نفس الفترات للمقارنة، بدون انتقاء سنين مريحة','Matched periods; no cherry-picked favourable years')]};return `<div class="split"><section><div class="eyebrow">${t('تاريخي · مش توقع','Historical · not a forecast')}</div><h2>${t('طقس السنين اللي فاتت','Weather in past years')}</h2>${audio()}<p>${t('سخا · ٢٠٠١–٢٠٢٥. بيانات يومية موجودة ومدققة؛ العرض العددي لسه مش موصل هنا.','Sakha · 2001–2025. Audited daily data exists; numerical display is not connected here.')}</p>${btn('ارجع لنفس المكان','Return to the same place','back','primary')}</section><section><div class="metric-tabs" role="group" aria-label="${t('اختار اللي تفهمه','Choose what to explore')}">${Object.entries(labels).map(([key,v])=>`<button data-metric="${key}" aria-pressed="${metric===key}">${v[0]}</button>`).join('')}</div><h3>${labels[metric][0]}</h3><div class="graph" role="img" aria-label="${t('مكان رسم توضيحي فاضي، لا توجد قياسات معروضة','Empty chart layout, no measurements displayed')}"><span>—<br>${t('مكان الرسم فقط · القيم غير موصلة','Chart layout only · values not connected')}</span></div><p>${labels[metric][1]}</p>${status('unknown','مقارنة دورتين كاملتين مش متاحة','Full paired rotation comparison unavailable',t('نهايات المحاصيل وفحوص الصلاحية ناقصة. ده ما يمنعش عرض سياق طقس تاريخي مدعوم بعد توصيل البيانات.','Crop endpoints and feasibility checks are unresolved. Supported historical weather context can still be shown once data is connected.'))}${detail('للمهندس: الفترة والطريقة والمصدر','Engineer: period, method and provenance',`<p>NASA POWER · 2001-01-01 — 2025-12-31 · LST · 31.10° N, 30.95° E.</p><p>${t('منتجات MERRA2/SYN1DEG/POWER؛ API v2.10.3 حسب الملفات المحفوظة. بيانات إقليمية شبكية، مش قياس الحقل. تاريخ الجلب، هاش الإصدار والـ manifest غير موصلين في النموذج.','Saved source products MERRA2/SYN1DEG/POWER; API v2.10.3. Regional gridded data, not field observations. Retrieval time, release hash and manifest are not connected in this wireframe.')}</p><p class="mono">FAO56 ET0 with the ASCE daily cloudiness bound</p><p>${t('الحرارة °م؛ ET0 مم/يوم. ETc غير متاح بدون مراحل ومعاملات Kc مدعومة. عد الأيام الحارة يحتاج عتبة موثقة؛ لا نسميه خطر محصول بدون دليل.','Temperature °C; ET0 mm/day. ETc is unavailable without supported stages and Kc. Hot-day counts require a documented threshold; crop-risk labels need evidence.')}</p><p>${t('المقارنة تستخدم كتل سنين متتالية مشتركة، وتعلن استبعاد ٢٩ فبراير غير القابل للمطابقة. فترات المحاصيل والمدد وقواعد الاكتمال وإصدارات الطرق لازم تتثبت. لا أرقام أو حدود عدم يقين محسوبة هنا.','Paired comparison requires common consecutive year blocks, declared unmappable 29 February exclusions, crop periods, durations, completeness policies and pinned method versions. No numerical results or uncertainty bounds are computed here.')}</p>`)}</section></div>`;}
function forecast(){return `<div class="split"><section><div class="eyebrow">${t('تجريبي · منفصل عن التاريخي','Experimental · separate from historical replay')}</div><h2>${t('طقس الأيام الجاية','Weather in the next seven days')}</h2>${audio()}${status('unknown',outlook==='stale'?'التوقع قديم — الأرقام مخفية':'مفيش توقع حالي متاح',outlook==='stale'?'Stale outlook — values withheld':'No current forecast available',t('البيانات المحفوظة بتنتهي ٣١ أكتوبر ٢٠٢٦. مش أساس لتوقع حي في نوفمبر.','Saved data ends 31 October 2026. It cannot substantiate a live November forecast.'))}<p>${t('قرار زراعة مايو ٢٠٢٧ خارج السبعة أيام. نكمل التخطيط من غير التوقع.','May 2027 sowing is outside seven days. Planning continues without a forecast.')}</p>${btn('ارجع للخطة','Return to the plan','back','primary')}</section><section><h3>${t('مكان عرض الأيام — مفيش تنبؤات','Day-layout preview — no predictions')}</h3><p class="small">${t('تاريخ إصدار توضيحي فقط:','Illustrative issue date only:')} ${date('2026-11-11')}</p><ul class="day-list">${Array.from({length:7},(_,i)=>`<li><b>${date('2026-11-'+(12+i))}</b><span>${t('أقصى حرارة','Max temperature')} — °C<br>ET0 — ${t('مم/يوم','mm/day')}</span></li>`).join('')}</ul>${detail('المصدر والتجربة وعدم اليقين','Source, experiment and uncertainty',`<p>Chronos-2 + LoRA · NASA POWER Tmax + ${t('ET0 محسوب','calculated ET0')}.</p><p>${t('لا يوجد إصدار توقع فعلي أو cutoff مدخلات خاص بالتوقع. ٣١ أكتوبر نهاية البيانات المحفوظة، مش cutoff صالح للتوقع المعروض.','No issued forecast or forecast-specific input cutoff exists. 31 October is the saved-data endpoint, not a valid cutoff for this display.')}</p><p>${t('التجربة المسجلة لم تتفوق على خط أساس المتوسط المناخي الموسمي. تقييم يوليو–أكتوبر ٢٠٢٦ مستهلك، مش اختبار مستقل جديد.','The recorded experiment did not outperform seasonal climatology. July–October 2026 evaluation is consumed evidence, not a new independent test.')}</p><p>${t('لا يوجد نطاق عدم يقين معروض. q10/q50/q90 تجريبية وغير مضمونة المعايرة؛ لا نجمع الكميات اليومية ككميات أسبوعية. نموذج D−7 احتاج ١٤ خطوة لبلوغ D+7.','No uncertainty band is available. q10/q50/q90 are experimental, not guaranteed calibrated; daily quantiles are not weekly quantiles. The D−7 setup required 14 steps to reach D+7.')}</p><p>${t('المراجعة والـ adapter والـ source vintage ووقت الجلب والهاش تُعرض لما يتوفر سجل صالح. مفيش حساب ري أو محصول أو اعتماد ميعاد زراعة.','Model revision, adapter run, source vintage, retrieval time and hash require a valid record. This provides no irrigation, yield or planting-date approval.')}</p>`)}${detail('مراجعة التصميم: حالة قديمة / غير متاحة','Design review: stale / unavailable state',btn('اعرض حالة قديمة','Show stale state','stale')+btn('اعرض غير متاح','Show unavailable state','forecastunavailable'))}</section></div>`;}
function evidence(){return `<div class="split"><section><div class="eyebrow">${t('ورقة مراجعة','Evidence Card')} · ${plan.fixture?'UH-001':'DRAFT'} / ${num(plan.version)}</div><h2>${t('خطة نرجعلها مع المهندس','A plan to review with an engineer')}</h2>${audio()}${resultStatus()}<ul class="steps"><li>${t('المدخلات','Input')}: ${plan.confirmed?t('✓ أكّدتها، بما فيها المجهول','✓ Confirmed, including unknowns'):t('لسه مش مؤكدة','Unconfirmed')}</li><li>${t('الالتزامات','Commitments')}: ${plan.seasons.some(s=>s.cropLock||s.dateLock)?t('ثابتة باختيارك، مش ضمان نتيجة','Protected by choice, not a performance guarantee'):t('مفيش التزام ثابت','No protected commitments')}</li><li>${t('الفحص','Evaluation')}: ${plan.evaluated?t('نتيجة المثال فقط','Fixture result only'):t('لم يُنفذ','Not run')}</li><li>${t('الحفظ','Saving')}: ${plan.saved?t('معاينة حفظ ناجح','Simulated success'):t('غير محفوظة','Not saved')}</li><li>${t('الصلاحية الزراعية','Agricultural feasibility')}: ${t('غير مثبتة','Not established')}</li></ul>${plan.saveFailed?status('unknown','الحفظ ما اكتملش. إجاباتك موجودة.','Save failed. Answers retained.'):''}${plan.saved?status('saved','معاينة: مسودة محفوظة للمراجعة','Preview: review draft saved',t('محاكاة فقط. إغلاق الصفحة يضيّع البيانات. الحفظ مش موافقة على الزراعة.','Simulation only. Closing the page loses data. Saving is not planting approval.')):btn(plan.confirmed?'احفظ كمسودة للمراجعة · محاكاة':'راجع وأكّد قبل الحفظ',plan.confirmed?'Save review draft · simulation':'Review and confirm before saving',plan.confirmed?'save':'confirm','primary')}${btn('أراجع أو أعدّل المدخلات','Review or edit input','confirm','link')}</section><section>${detail('المواسم الأربعة والالتزامات','Four seasons and commitments',allSeasons())}<div class="box"><h3>${t('نسأل المهندس عن إيه؟','What should we ask the engineer?')}</h3><p>${t('مناسبة المواعيد والأصناف لأرضي؟ إمتى الحصاد والخلو بعد تغيير الزراعة؟ توفر الري وكفاية العلف؟','Are dates and cultivars applicable to my field? When are harvest and release after a sowing change? Is irrigation available, and is forage sufficient?')}</p></div><p>${t('مواعيد اتشافَت فقط','Dates inspected only')}: ${plan.inspected.length?plan.inspected.map(date).join(' · '):t('مفيش','None')}. ${t('الفحص مش معناه اعتمادها.','Inspection does not adopt them.')}</p>${detail('المجهول واللي اتغيّر','Unknowns and changes',`<p>${plan.modified?t('المسودة اتعدلت؛ النتائج القديمة مش حالية. المواعيد غير المعروفة ظاهرة في تفاصيل المواسم.','Draft edited; old results are no longer current. Unknown dates are shown in season details.'):t('مفيش تعديل على مواعيد المثال.','No edits to fixture dates.')}</p>${contextDetails()}`)}${engineer()}${detail('أدلة NASA المتاحة وحدودها','Applicable NASA evidence and limits',`<p>${t('وجود بيانات سخا ٢٠٠١–٢٠٢٥ وطريقة ET0 المدققة موثق. مفيش مقارنة رقمية مرتبطة بنسخة الخطة هنا، ولا مقارنة دوران كاملة. المصدر DATA_SPEC وSCIENCE؛ المواعيد من REFERENCE_SCENARIO لو اخترت المثال.','Sakha 2001–2025 data and the audited ET0 method are documented. No numerical comparison is bound to this plan version here, and no full rotation comparison is available. Sources: DATA_SPEC and SCIENCE; dates from REFERENCE_SCENARIO when using the fixture.')}</p>`)}${toolsLinks()}</section></div>`;}
function states(){return `<h2>${t('معاني الحالات — اختبار واجهة','Status meanings — interface test')}</h2>${audio()}<div class="state-grid">${status('rejected','× مرفوض: تعارض مثبت','× Rejected: demonstrated conflict')}${status('review-state','△ محتاج مراجعة: دليل ناقص','△ Needs review: evidence missing')}${status('unknown','؟ معلومة غير معروفة — مش صفر','? Unknown information — not zero')}${status('saved','▤ مسودة محفوظة — مش اعتماد','▤ Saved draft — not approval')}${status('feasible','✓ مثال صناعي فقط: ممكن بعد اكتمال الشروط','✓ Synthetic test only: feasible after supported checks',t('مش عم حسين ولا أي بديل حقيقي هنا.','Not Hussein or a real alternative here.'))}</div>${btn('ارجع','Return','back','primary')}`;}
function failure(){return `<h2>${t('المراجعة ما وصلتش','Review could not load')}</h2>${audio()}${status('unknown','اختياراتك لسه موجودة','Your choices are retained',t('محاكاة خطأ اتصال. مفيش نتيجة جديدة.','Simulated network failure. No new result.'))}${btn('جرّب تاني · محاكاة','Retry · simulation','confirmed','primary')}${btn('كمّل لورقة المراجعة','Continue to review draft','card')}`;}
const views={welcome,plan:planning,context:contextView,confirm:confirmation,result:promise,inspect:investigation,replay,outlook:forecast,card:evidence,states,failure};
function render(focus=false){const active=document.activeElement?.dataset;const opened=Array.from(body.querySelectorAll?.('details')||[]).map((d,i)=>d.open?i:-1);document.documentElement?.setAttribute('lang',locale==='ar'?'ar-EG':'en');document.documentElement?.setAttribute('dir',locale==='ar'?'rtl':'ltr');const phone=root.querySelector('.phone');phone.setAttribute('lang',locale==='ar'?'ar-EG':'en');phone.setAttribute('dir',locale==='ar'?'rtl':'ltr');root.querySelector('.app-head').innerHTML=`<strong class="brand">${t('سكة المواسم','Season Path')}</strong><div class="language row" role="group" aria-label="${t('اللغة','Language')}"><button data-locale="ar" lang="ar" aria-pressed="${locale==='ar'}">العربية</button><button data-locale="en" lang="en" aria-pressed="${locale==='en'}">English</button></div>`;root.querySelector('.fixture-label').textContent=t('نموذج V3 · الصوت والفحص والحفظ محاكاة فقط','Wireframe V3 · speech, checks and saving are simulated')+(plan.fixture?' · UH-001':'');const mini=root.querySelector('.mini-path');mini.hidden=page==='welcome';mini.setAttribute('aria-label',t('سكة المواسم، اضغط موسم للتعديل','Season Path; choose a season to edit'));mini.innerHTML=page==='welcome'?'':path();body.innerHTML=views[page]();if(!focus)Array.from(body.querySelectorAll?.('details')||[]).forEach((d,i)=>{d.open=opened.includes(i);});if(help)body.innerHTML+=`<aside class="help" role="status"><h3>${t('نمشي خطوة خطوة','One step at a time')}</h3><p>${t('اسمع للتوضيح، اختار الصورة أو جاوب، وبعدين راجع. لو الصوت مش شغال ومحتاج مساعدة، خلي شخص تثق فيه يقرأ معاك. المساعدة مش نجاح مستقل.','Listen, choose a picture or speak, then review. If audio fails and you need help, ask someone you trust to read with you. Assisted completion is not independent success.')}</p></aside>`;root.querySelector('.notice').hidden=true;root.querySelector('.app-foot').innerHTML=(page!=='welcome'?btn('رجوع','Back','back','link'):'')+btn('مساعدة','Help','help','link')+(page!=='welcome'?btn('ورقة المراجعة','Review draft','card','link'):'');root.querySelector('.review-nav').innerHTML=Object.keys(views).map(v=>`<button data-reviewpage="${v}">${v}</button>`).join('');if(focus){const h=body.querySelector?.('h2');h?.setAttribute('tabindex','-1');h?.focus({preventScroll:true});phone.scrollIntoView?.({block:'start',behavior:'instant'});}else if(active){const key=['action','crop','datepart','context','metric','candidate'].find(k=>active[k]!==undefined);if(key)Array.from(root.querySelectorAll(`[data-${key}]`)).find(e=>e.dataset[key]===active[key])?.focus({preventScroll:true});}}
function changeCrop(value){const s=plan.seasons[season];if(s.crop===value)return;if(s.cropLock||s.dateLock){pending={field:'crop',value,labelOld:cropName(s.crop),labelNew:cropName(value)};render();return;}invalidate();s.visited=false;s.crop=value;s.sow=null;if(!s.dateLock)s.end=null;s.release=null;render();}
function openDate(field){const v=plan.seasons[season][field];const [year,month,day]=(v||'--').split('-');editor={field,day:day?Number(day):'',month:month?Number(month):'',year:year?Number(year):'',iso:v};render();}
function applyDate(value){const s=plan.seasons[season],field=editor.field;if(value&&((field==='sow'&&s.end&&value>s.end)||(field==='end'&&s.sow&&value<s.sow))){notice(t('الزراعة لازم تكون قبل الحصاد أو في نفس اليوم.','Sowing must be on or before harvest.'));return;}if(s[field]===value){editor=null;render();return;}if(field==='end'&&s.dateLock){pending={field,value,labelOld:date(s.end),labelNew:date(value)};editor=null;render();return;}invalidate();s.visited=false;s[field]=value;s.release=null;if(field==='sow'&&!s.dateLock)s.end=null;editor=null;render();}
root.addEventListener('change',e=>{const el=e.target,d=el.dataset;if(el.id==='voice-simulation'){voice=el.value;playing=false;render();return;}if(d.datepart){editor[d.datepart]=el.value;return;}if(Object.hasOwn(d,'typeddate')){const [y,m,day]=el.value.split('-');editor.year=y;editor.month=m;editor.day=day;editor.iso=el.value;return;}if(d.context){const key=d.context;let value=el.value||null;if(['area','prep'].includes(key)&&value!==null){value=Number(value);if(!Number.isFinite(value)||(key==='area'?value<=0:value<0||!Number.isInteger(value))){notice(t('راجع القيمة: المساحة أكبر من صفر والتجهيز أيام كاملة.','Area must be positive; preparation uses whole nonnegative days.'));return;}}if(plan[key]!==value){invalidate();plan[key]=value;}render();}});
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.layout){root.querySelector('.stage').classList.toggle('desktop',d.layout==='desktop');root.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.layout===d.layout)));return;}if(d.locale){locale=d.locale;playing=false;voice='ready';render(true);notice(t('اللغة اتغيرت؛ اختياراتك زي ما هي.','Language changed; your choices are retained.'));return;}if(d.reviewpage){go(d.reviewpage);return;}if(d.season!==undefined){history.push(ctx());season=Number(d.season);page='plan';step='crop';editor=null;pending=null;playing=false;voice='ready';render(true);return;}if(d.crop!==undefined){changeCrop(Number(d.crop));return;}if(d.candidate){candidate=d.candidate;if(!plan.inspected.includes(candidate))plan.inspected.push(candidate);render();return;}if(d.metric){metric=d.metric;playing=false;render();return;}const a=d.action;
if(a==='start'){go('plan');return;}if(a==='fixture'){loadFixture();go('plan');return;}if(a==='back'){back();return;}if(a==='help'){help=!help;render();return;}if(a==='listen'){voice='ready';playing=true;section=0;render();return;}if(a==='stopaudio'){playing=false;render();return;}if(a==='nextaudio'){section=(section+1)%scripts().length;render();return;}if(a==='speak'){playing=false;voice='listening';render();return;}if(a==='recognized'){voice='recognized';render();return;}if(a==='stopvoice'||a==='correctvoice'){voice='ready';render();notice(t('مفيش إجابة اتأكدت. تقدر تصحح بالاختيارات.','No answer was confirmed. Correct using the choices.'));return;}if(a==='proposal'){voice='ready';changeCrop(0);return;}if(a==='dateproposal'){voice='ready';if(page!=='plan'){season=0;step='essentials';go('plan');}openDate('end');return;}
if(a==='cropnext'){if(plan.seasons[season].crop===null){notice(t('اختار صورة أو اضغط مش عارف.','Choose a crop or choose I don’t know.'));return;}history.push(ctx());step='essentials';render(true);return;}if(a==='unknowncrop'){changeCrop(null);if(pending)return;history.push(ctx());step='essentials';render(true);return;}if(a==='seasonnext'){plan.seasons[season].visited=true;history.push(ctx());if(season<3){season++;step='crop';render(true);}else{page='context';render(true);}return;}
if(a==='sowdate'||a==='enddate'){openDate(a==='sowdate'?'sow':'end');return;}if(a==='canceleditor'){editor=null;render();return;}if(a==='unknowndate'){applyDate(null);return;}if(a==='applydate'){const {year,month,day}=editor;const iso=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const dt=new Date(iso+'T12:00:00Z');if(!year||!month||!day||!Number.isFinite(dt.valueOf())||dt.toISOString().slice(0,10)!==iso){notice(t('اختار يوم وشهر وسنة صحيحين.','Choose a valid day, month and year.'));return;}applyDate(iso);return;}
if(a==='croplock'||a==='datelock'){const s=plan.seasons[season],field=a==='croplock'?'cropLock':'dateLock';if(field==='cropLock'&&s.crop===null){notice(t('حدد المحصول قبل تثبيته.','Choose a crop before protecting it.'));return;}if(s[field]){pending={field,value:false,labelOld:t('ثابت','Protected'),labelNew:t('غير ثابت','Unprotected')};render();}else{invalidate();s.visited=false;s[field]=true;render();}return;}
if(a==='cancelprotected'){pending=null;render();return;}if(a==='applyprotected'){const s=plan.seasons[season],p=pending;invalidate();s.visited=false;s[p.field]=p.value;if(p.field==='crop'){s.sow=null;if(!s.dateLock)s.end=null;s.release=null;if(p.value===null)s.cropLock=false;}if(p.field==='end'){s.release=null;if(p.value===null)s.dateLock=false;}pending=null;render();return;}
if(a==='confirm'||a==='context'||a==='card'||a==='replay'||a==='outlook'||a==='states'){go(a);return;}if(a==='confirmed'){plan.confirmed=true;plan.evaluated=plan.fixture&&!plan.modified;plan.result=plan.evaluated?'rejected':'needs_review';go('result');return;}if(a==='inspect'){if(!(plan.fixture&&!plan.modified)){notice(t('مفيش مواعيد مدعومة للمسودة دي.','No supported investigation dates for this draft.'));return;}candidate='2027-05-28';if(!plan.inspected.includes(candidate))plan.inspected.push(candidate);go('inspect');return;}if(a==='adopt'){if(!plan.fixture||plan.modified){notice(t('المثال اتغير، راجع المدخلات الأول.','The fixture changed; review inputs first.'));return;}invalidate();plan.seasons[1].visited=false;plan.seasons[1].sow=candidate;plan.seasons[1].end=null;plan.seasons[1].release=null;go('confirm');return;}if(a==='save'){if(!plan.confirmed){go('confirm');return;}plan.saved=true;plan.saveFailed=false;render();return;}if(a==='savefail'){plan.saved=false;plan.saveFailed=true;go('card');return;}if(a==='loadfail'){plan.evaluated=false;plan.result=null;go('failure');return;}if(a==='stale'||a==='forecastunavailable'){outlook=a==='stale'?'stale':'unavailable';render();return;}
});
render();
})();
</script></body></html>
