<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 03 · What must stay</title><link rel="stylesheet" href="lab.css"></head>
<body>
<script src="lab.js"></script>
<script>
(function(){
const {icon,crop,CROPS,PURPOSE,SEASONS}=Lab;
// UH-001 fixture values (docs/product/reference-scenario.md). Illustrative, not a real farmer.
const S=[
  {k:'s1',crop:'berseem',purpose:'forage',kind:'end',date:'2027-05-20'},
  {k:'s2',crop:'maize',purpose:'grain',kind:'start',date:'2027-05-15'},
  {k:'s3',crop:'wheat',purpose:'grain',kind:'start',date:'2027-11-20'},
  {k:'s4',crop:'sorghum',purpose:'grain',kind:'start',date:'2028-06-01'}
];
const fresh=()=>({locks:{},confirmed:false,stale:false});
const def={
  num:'03',title:'What must stay? Protect, then confirm once',
  data:fresh(),
  states:[
    {id:'protect',name:'1 · What must stay? (nothing locked yet)',note:'One screen, one job: tap the lock on what must not change. The seasons were already said back one by one in lab 02, so this page does not read them again.'},
    {id:'ready',name:'2 · Locked (UH-001) → confirm once',note:'UH-001 locks seasons 1–3. One explicit confirm for everything, with a clear intent. Silence or a bare “yeah” never confirms.'},
    {id:'stale',name:'3 · Changed after confirming',note:'Editing a confirmed fact stops audio and marks the last check as not current, until confirmed again.'}
  ],
  enter(id,ctx){const d=ctx.data=fresh();if(id!=='protect')d.locks={s1:true,s2:true,s3:true};if(id==='stale'){d.confirmed=true;d.stale=true;}},
  progress:()=>null,
  caption:false,
  prompt(ctx){const d=ctx.data;
    if(d.stale)return{ar:'غيّرت ميعاد بعد التأكيد. الفحص اللي فات مابقاش حالي. أكّد تاني.',en:'You changed a date after confirming. The last check is no longer current. Confirm again.'};
    if(!Object.keys(d.locks).length)return{ar:'إيه اللي لازم يفضل زي ما هو مهما حصل؟ دوس على القفل.',en:'What must stay exactly as it is, whatever happens? Tap the lock.'};
    return{ar:'لو كله صح، دوس "أكّد وشيّك".',en:'If everything is right, press “Confirm and check”.'};},
  render(ctx){
    const d=ctx.data,L=ctx.locale;
    const rows=S.map((g,i)=>{const on=!!d.locks[g.k];const changed=d.stale&&i===1;
      return `<li class="${on?'locked':''} ${changed?'current':''}"><span class="portrait">${crop(g.crop)}</span>
        <div class="txt"><h3>${ctx.t(CROPS[g.crop])} <span class="meta"><span class="sep">· </span>${ctx.t(PURPOSE[g.purpose])}</span></h3>
        <div class="when">${icon(g.kind==='end'?'cut':'sow')}${ctx.date(changed?'2027-05-18':g.date)}</div><div class="meta">${ctx.t(SEASONS[i])}</div></div>
        <div class="end"><button class="lock-btn" data-act="lock" data-v="${g.k}" aria-pressed="${on}" aria-label="${L==='ar'?'لازم يفضل':'Must stay'}: ${ctx.t(CROPS[g.crop])}">${icon('lock')}<span>${L==='ar'?'ثابت':'Keep'}</span></button></div></li>`;}).join('');
    const facts=`<div class="facts">
      <span class="fact">${icon('field')}${L==='ar'?'١ هكتار':'1 ha'}<small>${L==='ar'?'المساحة':'area'}</small></span>
      <span class="fact">${icon('soil')}${L==='ar'?'طينية':'Clay'}<small>${L==='ar'?'كلامك':'you said'}</small></span>
      <span class="fact unk">${icon('salt')}؟<small>${L==='ar'?'الملوحة':'salinity'}</small></span>
      <span class="fact unk">${icon('drop')}؟<small>${L==='ar'?'مواعيد المية':'water'}</small></span>
      <span class="fact assume">${icon('calendar')}${L==='ar'?'٧ أيام':'7 days'}<small>${L==='ar'?'تجهيز (افتراض)':'prep (assumed)'}</small></span></div>`;
    const head=d.stale?`<div class="banner unknown">${icon('review')}<span>${L==='ar'?'غيّرت ميعاد الذرة: أكّد تاني':'Maize date changed: confirm again'}</span></div>`
      :`<h2 class="question">${L==='ar'?'إيه اللي لازم يفضل؟':'What must stay?'}</h2>`;
    const n=Object.values(d.locks).filter(Boolean).length;
    return head+`<ol class="path wide short" aria-label="${L==='ar'?'المواسم':'Seasons'}">${rows}</ol>`+facts+
      `<button class="primary wide-btn" data-act="confirm">${icon('check')}${L==='ar'?'أكّد وشيّك على الخطة':'Confirm and check the plan'}${n?` <span class="badge protected" style="background:#fff">${icon('lock')}${ctx.num(n)}</span>`:''}</button>`;
  },
  utterances(ctx){const d=ctx.data;
    return[
      {label:'Locks by voice',say:{ar:'البرسيم والذرة والقمح لازم يفضلوا',en:'Berseem, maize and wheat must stay'},effect(ctx){return ctx.implicit(this.say,[{ar:'ثابت: برسيم',en:'Keep: berseem'},{ar:'ذرة',en:'maize'},{ar:'قمح',en:'wheat'}],ctx=>{ctx.data.locks={s1:true,s2:true,s3:true};});}},
      {label:'Explicit confirm by voice',say:{ar:'أكّد',en:'Confirm'},effect(){location.href='lab-04-check.html';}},
      {label:'“Yeah” alone is not enough here',say:{ar:'آه',en:'Yeah'},effect(){return{ar:'علشان أتأكد: قول "أكّد" أو دوس الزرار.',en:'To be sure: say “confirm” or press the button.'};}},
      {label:'Correction in one sentence',say:{ar:'لا، الذرة يوم ١٨ مايو',en:'No, maize on 18 May'},effect(ctx){ctx.heard={said:this.say,chips:[{text:{ar:'زراعة الذرة ١٨ مايو ٢٠٢٧',en:'Maize sowing 18 May 2027'}}],onYes(ctx){if(ctx.data.confirmed)ctx.go('stale');return null;}};return{ar:'الذرة يوم ١٨ مايو ٢٠٢٧؟',en:'Maize on 18 May 2027?'};}}];},
  action(a,b,ctx){const d=ctx.data;
    if(a==='lock'){const k=b.dataset.v;d.locks[k]=!d.locks[k];const g=S.find(x=>x.k===k);
      return d.locks[k]?{ar:`${CROPS[g.crop].ar}: ثابت.`,en:`${CROPS[g.crop].en}: kept.`}:{ar:`${CROPS[g.crop].ar}: ممكن يتغيّر.`,en:`${CROPS[g.crop].en}: can change.`};}
    if(a==='confirm'){location.href='lab-04-check.html';return null;}
    if(a==='back'){location.href='lab-02-seasons.html';return null;}
  },
  notes:[
    'Why this page exists (13 Nov feedback “it repeats lab 02”): lab 02 collects and says back each answer; this page asks the one new question, what must stay, and gets the single explicit confirm. It no longer re-reads each season.',
    'Numbers appear once: no season numbers inside the cards (13 Nov feedback). The season name sits under each crop.',
    'Field facts are small picture tiles. Unknown (salinity, water timing) is a dashed “?”, never zero or hidden. The 7 preparation days are a dashed amber assumption, not a recommendation.',
    'Hectares stay hectares. No silent feddan conversion (reference scenario §1).',
    'Protection never implies enough feed or a guaranteed harvest.'
  ]
};
Lab.page(def);
})();
</script>
</body>
</html>
