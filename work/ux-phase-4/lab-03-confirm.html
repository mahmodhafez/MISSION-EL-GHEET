<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 03 · What stays, what can change</title><link rel="stylesheet" href="lab.css"></head>
<body>
<script src="lab.js"></script>
<script>
(function(){
const {icon,crop,CROPS,PURPOSE,SEASONS}=Lab;
// UH-001 fixture (docs/product/reference-scenario.md; packages/meg-core/tools/fixtures/uh001.json on planner/candidate-generation).
// Planner contract: it explores ONLY what the farmer allows (ExplorationChoice / DateRangeChoice), after a scope
// readback and an explicit confirmation (exploration_confirmed + scope_hash). Locks never change.
const S=[
  {k:'s1',crop:'berseem',purpose:'forage',kind:'end',date:'2027-05-20'},
  {k:'s2',crop:'maize',purpose:'grain',kind:'start',date:'2027-05-15'},
  {k:'s3',crop:'wheat',purpose:'grain',kind:'start',date:'2027-11-20'},
  {k:'s4',crop:'sorghum',purpose:'grain',kind:'start',date:'2028-06-01'}
];
const DATES=['2027-05-28','2027-06-01'];
const fresh=()=>({locks:{},dates:{},swap:false,stale:false});
const UH=d=>{d.locks={s1:true,s2:true,s3:true};d.dates={'2027-05-28':true,'2027-06-01':true};d.swap=true;};
const def={
  num:'03',title:'What stays, what can change, then confirm the search',
  data:fresh(),
  states:[
    {id:'protect',name:'1 · What must stay? (nothing locked yet)',note:'Tap the lock on what must not change. On berseem the lock keeps the last cut; on maize and wheat it keeps the crop and its purpose (UH-001 commitments).'},
    {id:'locked',name:'2 · Locked (UH-001)',note:'Seasons 1–3 locked. Next: what is allowed to change.'},
    {id:'change',name:'3 · What can change? (permissions)',note:'The planner only searches what the farmer allows: here maize sowing on 28 May or 1 June, and maize instead of sorghum in season 4 (UH-001 exploration choices). Nothing is pre-ticked.'},
    {id:'scope',name:'4 · Search readback + one confirm',note:'Short readback of what will be searched and what is unknown. One explicit confirm starts the check and the search. A choice the KB cannot evaluate (season 4 maize: profile_binding_unavailable) is only known after the search, so it shows in lab 05, not here (corrected 14 Nov against the planner’s scope preview).'},
    {id:'stale',name:'5 · Changed after confirming',note:'Editing a confirmed fact stops audio and marks the last check as not current, until confirmed again.'}
  ],
  enter(id,ctx){const d=ctx.data=fresh();if(id!=='protect')d.locks={s1:true,s2:true,s3:true};if(id==='scope'||id==='stale')UH(d);if(id==='stale')d.stale=true;},
  progress:()=>null,
  caption:false,
  prompt(ctx){const d=ctx.data,st=ctx.state;
    if(d.stale)return{ar:'غيّرت ميعاد بعد التأكيد. أكّد تاني.',en:'You changed a date after confirming. Confirm again.'};
    if(st==='change')return{ar:'إيه اللي ممكن يتغيّر علشان ندوّر على بدايل؟ ميعاد الذرة؟ محصول الموسم ٤؟',en:'What may change so we can look for alternatives? The maize date? The season 4 crop?'};
    if(st==='scope')return{ar:'هندوّر على ميعادين للذرة، وعلى ذرة شامية في الموسم ٤. لو تمام، قول "دوّر".',en:'We will look at two maize dates, and maize in season 4. If that is OK, say “search”.'};
    if(!Object.keys(d.locks).length)return{ar:'إيه اللي لازم يفضل زي ما هو مهما حصل؟ دوس على القفل.',en:'What must stay exactly as it is, whatever happens? Tap the lock.'};
    return{ar:'تمام. اللي بعده: إيه اللي ممكن يتغيّر؟',en:'Good. Next: what may change?'};},
  render(ctx){
    const d=ctx.data,L=ctx.locale,st=ctx.state;
    if(st==='change'){
      const chip=(on,act,v,label)=>`<button class="pchip" data-act="${act}" data-v="${v}" aria-pressed="${on}">${on?icon('check'):icon('plus')}<span>${label}</span></button>`;
      return `<h2 class="question">${L==='ar'?'إيه اللي ممكن يتغيّر؟':'What may change?'}</h2>
        <div class="perm"><span class="s-art">${crop('maize')}</span><div><b>${L==='ar'?'ميعاد زراعة الذرة':'Maize sowing date'}</b><span class="was">${L==='ar'?'دلوقتي':'now'} ${ctx.date('2027-05-15',{noYear:true})}</span>
          <div class="pchips">${DATES.map(x=>chip(!!d.dates[x],'date',x,ctx.date(x,{noYear:true}))).join('')}</div></div></div>
        <div class="perm"><span class="s-art">${crop('sorghum')}</span><div><b>${L==='ar'?'الموسم ٤ بدل الذرة الرفيعة':'Season 4 instead of sorghum'}</b>
          <div class="pchips">${chip(d.swap,'swap','1',ctx.t(CROPS.maize))}</div></div></div>
        <div class="two-btns"><button class="primary" data-act="toscope">${icon('check')}${L==='ar'?'التالي':'Next'}</button><button class="secondary" data-act="checkonly">${L==='ar'?'مفيش حاجة تتغيّر':'Nothing may change'}</button></div>`;}
    if(st==='scope'||d.stale){
      const items=S.map((g,i)=>({crop:g.crop,iso:g.date,kind:g.kind,mark:d.locks[g.k]?'lock':(i===3&&d.swap?'change':null),cls:d.locks[g.k]?'lock':''}));
      const dts=DATES.filter(x=>d.dates[x]);
      return (d.stale?`<div class="banner unknown">${icon('review')}<span>${L==='ar'?'غيّرت ميعاد الذرة: أكّد تاني':'Maize date changed: confirm again'}</span></div>`:`<h2 class="question">${L==='ar'?'هندوّر في كده':'This is what we will check'}</h2>`)+
        Lab.strip(ctx,items,{cls:'in compact'})+
        `<ul class="scope-list">
          ${dts.length?`<li class="ok">${icon('search')}<span>${L==='ar'?'ذرة':'Maize'}: ${dts.map(x=>ctx.date(x,{noYear:true})).join(L==='ar'?' أو ':' or ')}</span></li>`:''}
          ${d.swap?`<li class="ok">${icon('search')}<span>${L==='ar'?'الموسم ٤: ذرة شامية بدل الذرة الرفيعة':'Season 4: maize instead of sorghum'}</span></li>`:''}
          <li class="unk">${icon('unknown')}<span>${L==='ar'?'ميعاد زراعة البرسيم: مش معروف':'Berseem sowing date: unknown'}</span></li>
        </ul>
        <button class="primary wide-btn" data-act="confirm">${icon('search')}${L==='ar'?'أكّد ودوّر':'Confirm and search'}</button>`;}
    const rows=S.map((g,i)=>{const on=!!d.locks[g.k];
      return `<li class="${on?'locked':''}"><span class="portrait">${crop(g.crop)}</span>
        <div class="txt"><h3>${ctx.t(CROPS[g.crop])} <span class="meta"><span class="sep">· </span>${ctx.t(PURPOSE[g.purpose])}</span></h3>
        <div class="when">${icon(g.kind==='end'?'cut':'sow')}${ctx.date(g.date)}</div><div class="meta">${ctx.t(SEASONS[i])}</div></div>
        <div class="end"><button class="lock-btn" data-act="lock" data-v="${g.k}" aria-pressed="${on}" aria-label="${L==='ar'?'لازم يفضل':'Must stay'}: ${ctx.t(CROPS[g.crop])}">${icon('lock')}<span>${L==='ar'?'ثابت':'Keep'}</span></button></div></li>`;}).join('');
    const facts=`<div class="facts">
      <span class="fact">${icon('field')}${L==='ar'?'١ هكتار':'1 ha'}<small>${L==='ar'?'المساحة':'area'}</small></span>
      <span class="fact">${icon('soil')}${L==='ar'?'طينية':'Clay'}<small>${L==='ar'?'كلامك':'you said'}</small></span>
      <span class="fact unk">${icon('salt')}؟<small>${L==='ar'?'الملوحة':'salinity'}</small></span>
      <span class="fact unk">${icon('drop')}؟<small>${L==='ar'?'مواعيد المية':'water'}</small></span>
      <span class="fact assume">${icon('calendar')}${L==='ar'?'٧ أيام':'7 days'}<small>${L==='ar'?'تجهيز (افتراض)':'prep (assumed)'}</small></span></div>`;
    const n=Object.values(d.locks).filter(Boolean).length;
    return `<h2 class="question">${L==='ar'?'إيه اللي لازم يفضل؟':'What must stay?'}</h2><ol class="path wide short" aria-label="${L==='ar'?'المواسم':'Seasons'}">${rows}</ol>`+facts+
      `<button class="primary wide-btn" data-act="next" ${n?'':'disabled'}>${icon('check')}${L==='ar'?'التالي: إيه اللي ممكن يتغيّر؟':'Next: what may change?'}</button>`;
  },
  utterances(ctx){const st=ctx.state;
    if(st==='change')return[{label:'Permission by voice',say:{ar:'الذرة ممكن تتأخر لـ ٢٨ مايو أو أول يونيو',en:'Maize can move to 28 May or 1 June'},effect(ctx){return ctx.implicit(this.say,[{ar:'الذرة: ٢٨ مايو',en:'Maize: 28 May'},{ar:'١ يونيو',en:'1 June'}],ctx=>{ctx.data.dates={'2027-05-28':true,'2027-06-01':true};});}},
      {label:'Vague permission (not usable)',say:{ar:'أي ميعاد مناسب',en:'Any suitable date'},effect(ctx){ctx.setVoice('notunderstood');return{ar:'محتاج مواعيد بعينها. قول مثلاً: ٢٨ مايو. أو دوس على المواعيد.',en:'I need specific dates, for example “28 May”. Or tap the dates.'};}}];
    if(st==='scope')return[{label:'Explicit confirm',say:{ar:'دوّر',en:'Search'},effect(){location.href='lab-04-check.html';}},{label:'“Yeah” alone is not enough',say:{ar:'آه',en:'Yeah'},effect(){return{ar:'علشان أتأكد: قول "دوّر" أو دوس الزرار.',en:'To be sure: say “search” or press the button.'};}}];
    return[{label:'Locks by voice',say:{ar:'البرسيم والذرة والقمح لازم يفضلوا',en:'Berseem, maize and wheat must stay'},effect(ctx){return ctx.implicit(this.say,[{ar:'ثابت: برسيم',en:'Keep: berseem'},{ar:'ذرة',en:'maize'},{ar:'قمح',en:'wheat'}],ctx=>{ctx.data.locks={s1:true,s2:true,s3:true};});}}];},
  action(a,b,ctx){const d=ctx.data,v=b.dataset.v;
    if(a==='lock'){d.locks[v]=!d.locks[v];const g=S.find(x=>x.k===v);
      return d.locks[v]?{ar:`${CROPS[g.crop].ar}: ثابت.`,en:`${CROPS[g.crop].en}: kept.`}:{ar:`${CROPS[g.crop].ar}: ممكن يتغيّر.`,en:`${CROPS[g.crop].en}: can change.`};}
    if(a==='next'){const keep=d.locks;ctx.go('change');ctx.data.locks=keep;ctx.rerender();return def.prompt(ctx);}
    if(a==='date'){d.dates[v]=!d.dates[v];return null;}
    if(a==='swap'){d.swap=!d.swap;return null;}
    if(a==='toscope'){const keep={locks:d.locks,dates:d.dates,swap:d.swap};ctx.go('scope');Object.assign(ctx.data,keep);ctx.rerender();return def.prompt(ctx);}
    if(a==='checkonly'||a==='confirm'){location.href='lab-04-check.html';return null;}
    if(a==='back'){if(ctx.state==='scope'){ctx.go('change');UH(ctx.data);}else if(ctx.state==='change')ctx.go('locked');else location.href='lab-02-seasons.html';return null;}
  },
  notes:[
    'Follows the planner on planner/candidate-generation: it searches only explicit permissions (dates, crops), shows a scope readback with blocked choices and missing inputs, and needs one explicit confirmation (exploration_confirmed) before searching. The preview itself never authorizes.',
    'UH-001 permissions: maize sowing 28 May or 1 June; maize instead of sorghum in season 4. The planner’s scope preview does not flag the season-4 block; it appears in the search exclusions, so lab 05 shows “not checked”.',
    '“Nothing may change” is the check-only journey: the Promise Test runs on the plan as it is, with no search.',
    'Missing inputs the planner reports (berseem sowing date) are shown as dashed “?” lines; they are allowed but make results needs_review.',
    'Hectares stay hectares. Protection never implies enough feed or a guaranteed harvest.'
  ]
};
Lab.page(def);
})();
</script>
</body>
</html>
