<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 01 · Welcome</title><link rel="stylesheet" href="lab.css"></head>
<body>
<script src="lab.js"></script>
<script>
(function(){
const {icon,crop}=Lab;
function intentArt(kind){
  const minis=['berseem','maize','wheat','sorghum'].map(c=>`<span class="mini">${kind==='check'?crop(c):''}</span>`).join('');
  return `<span class="intent-art ${kind==='check'?'':'empty'}">${minis}<span class="badge-ic">${icon(kind==='check'?'search':'plus')}</span></span>`;
}
const def={
  num:'01',title:'Welcome & first use',
  states:[
    {id:'start',name:'1 · First open (silent)',note:'Logo, app name, one Start per language. Browsers block audio until a tap, so nothing plays yet. No mic prompt.'},
    {id:'intent',name:'2 · Choose what to do',note:'After Start the app greets in one short sentence and asks this. Two pictures: a filled season row with a magnifier (check my plan) and an empty row with a plus (plan from the start).'},
    {id:'try',name:'3 · Practice turn',note:'The big mic picture IS the button: tap, talk, tap again. In the lab, finishing simulates hearing “wheat”; the first tap shows the one-line permission reason. Teaches push-to-talk by doing (research: onboarding by play, not instructions).'}
  ],
  data:{practiced:false},
  dock:ctx=>ctx.state!=='start',
  // Lab only: finishing the practice turn simulates hearing “wheat”. The labs never open the real microphone.
  onMicDone(ctx){if(ctx.state!=='try')return null;ctx.data.practiced=true;return{ar:'برافو، سمعت: قمح. كده إنت عارف تستخدم الميكروفون.',en:'Good, I heard: wheat. Now you know how the mic works.'};},
  back:false,
  caption:false, // the mic hint under the picture already says what to do
  quiet:ctx=>ctx.state==='start',
  prompt(ctx){
    if(ctx.state==='intent')return{ar:'أهلاً بيك. عندك خطة نشيّك عليها، ولا نخطط سوا من الأول؟',en:'Welcome. Do you have a plan to check, or shall we plan from the start?'};
    if(ctx.state==='try')return{ar:'جرّب: دوس الميكروفون وقول اسم محصول.',en:'Try it: tap the mic and say a crop.'};
    return null;
  },
  render(ctx){
    const L=ctx.locale;
    if(ctx.state==='start')return `<div class="start">
      ${Lab.logo()}
      <h2 class="question" style="max-width:none">${L==='ar'?'سكة المواسم':'Season Path'}</h2>
      <p class="sub">${L==='ar'?'خطّط أرضك لـ ٤ مواسم':'Plan your field for 4 seasons'}</p>
      <div class="actions">
        <button class="primary" data-act="start" lang="ar">${icon('play')}<span>ابدأ</span></button>
        <button class="secondary" data-act="start-en" lang="en">${icon('play')}<span>Start</span></button>
      </div>
      <span class="badge sim">${ctx.t(Lab.UI.sim)}</span></div>`;
    if(ctx.state==='intent')return `<h2 class="question">${L==='ar'?'عايز تعمل إيه؟':'What would you like to do?'}</h2><div class="tiles two">
      ${[['check',{ar:'شيّك على خطتي',en:'Check my plan'}],['new',{ar:'خطّط من الأول',en:'Plan from the start'}]].map(([v,t])=>`<div class="tile-wrap"><button class="tile" data-act="intent" data-v="${v}"><span class="art" style="width:auto;background:none">${intentArt(v)}</span>${ctx.t(t)}</button><button class="hear" data-act="hear" aria-label="${L==='ar'?'اسمع':'Listen'}: ${ctx.t(t)}">${icon('speaker')}</button></div>`).join('')}</div>`;
    if(ctx.state==='try'){const v=ctx.voice,ok=ctx.data.practiced;
      const cls=ok?'ok':v==='listening'||v==='asking'?'listening':v==='processing'?'processing':'';
      const hint=ok?(L==='ar'?'سمعتك: قمح':'I heard you: wheat'):v==='listening'?(L==='ar'?'سامعك… دوس لما تخلّص':'Listening… tap when done'):v==='asking'?(L==='ar'?'اسمح بالميكروفون':'Allow the microphone'):v==='processing'?(L==='ar'?'بفهم…':'Working it out…'):(L==='ar'?'دوس على الميكروفون واتكلّم':'Tap the mic and talk');
      return `<div class="hero"><button class="mic-big ${cls}" data-act="${ok?'again':'mic'}" aria-label="${hint}">${icon(ok?'check':'mic')}<span class="ring"></span></button>
        <h2>${L==='ar'?'جرّب الميكروفون':'Try the mic'}</h2><p class="mic-hint" role="status">${hint}</p><p>${L==='ar'?'قول اسم محصول. تمرين بس.':'Say a crop name. Just practice.'}</p></div>
      ${ok?`<a class="primary wide-btn" href="lab-02-seasons.html">${icon('check')}${L==='ar'?'يلا نبدأ':'Let us start'}</a>`:`<button class="secondary wide-btn" data-act="skip">${L==='ar'?'اتخطّى':'Skip'}</button>`}`;}
  },
  utterances(ctx){
    if(ctx.state==='try')return[{label:'Practice works',say:{ar:'قمح',en:'Wheat'},effect(ctx){ctx.data.practiced=true;return{ar:'برافو، سمعت: قمح. يلا نبدأ.',en:'Good, I heard: wheat. Let us start.'};}}];
    if(ctx.state==='intent')return[{label:'Check plan',say:{ar:'عندي خطة',en:'I have a plan'},effect(ctx){ctx.go('try');return{ar:'تمام، هنشيّك على خطتك.',en:'OK, we will check your plan.'};}},{label:'Plan together',say:{ar:'خطّط معايا',en:'Plan with me'},effect(ctx){ctx.go('try');return{ar:'تمام، هنخطط سوا.',en:'OK, we will plan together.'};}}];
    return[];
  },
  action(a,b,ctx){
    if(a==='start'||a==='start-en'){ctx.locale=a==='start'?'ar':'en';ctx.audioStarted=true;ctx.go('intent');return null;}
    if(a==='intent'){ctx.go('try');return null;}
    if(a==='skip'){location.href='lab-02-seasons.html';return null;}
    if(a==='again'){ctx.data.practiced=false;return null;}
  },
  notes:[
    'Logo: media/brand/mission-el-gheet-logo.svg (terracotta). Cream-gold and currentColor variants sit beside it for dark or tinted backgrounds.',
    'The separate spoken-intro screen was removed (13 Nov feedback). The greeting is one short sentence spoken on the next screen.',
    'Start is also the audio unlock: the first tap is the user gesture browsers need before playing sound.',
    'Language is chosen by which Start you press; the header switch stays available on every screen.',
    'No mic permission on this page until the practice turn.',
    '“Practice example” label stays visible: demo data must be visibly illustrative (design §1).'
  ]
};
Lab.page(def);
})();
</script>
</body>
</html>
