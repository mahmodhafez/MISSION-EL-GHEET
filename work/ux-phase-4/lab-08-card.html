<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 08 · Save & summary</title><link rel="stylesheet" href="lab.css"></head>
<body>
<script src="lab.js"></script>
<script>
(function(){
const {icon}=Lab;
// Takeaway wording: reference-scenario.md §6 (digits on screen; spoken form is generated from the template).
const TAKEAWAY={ar:'حشة البرسيم يوم ٢٠ مايو ثابتة في الخطة. ميعاد الذرة الحالي متعارض معاها. فيه مواعيد نراجعها، بس مفيش بديل أكيد لسه. هنحفظ خطتك والنقط اللي محتاجة مراجعة.',en:'The berseem cut on 20 May is kept in the plan. The current maize date conflicts with it. There are dates to review, but no sure alternative yet. We will save your plan and the points that need review.'};
const PLAN=[{crop:'berseem',iso:'2027-05-20',kind:'end',mark:'lock',cls:'lock'},{crop:'maize',iso:'2027-05-15',kind:'start',mark:'reject',cls:'reject'},{crop:'wheat',iso:'2027-11-20',kind:'start',mark:'lock',cls:'lock'},{crop:'sorghum',iso:'2028-06-01',kind:'start',mark:'review',cls:'review'}];
const def={
  num:'08',title:'Save & spoken summary',
  states:[
    {id:'ready',name:'1 · Summary before saving',note:'Calm summary: the four crops, one line naming the one problem, one Save button. The full summary is spoken (speaker button).'},
    {id:'saving',name:'2 · Saving',note:'Named operation; Save disabled to prevent duplicates.'},
    {id:'saved',name:'3 · Saved + spoken summary',note:'Saved only after the server confirms. The plan still “has a conflict”: saving is storage, not approval.'},
    {id:'failed',name:'4 · Save failed',note:'“Not saved” in words and speech. Retry keeps everything. No celebration.'},
    {id:'superseded',name:'5 · Plan changed after saving',note:'The saved copy describes an older version; the app says so and stops old audio.'}
  ],
  progress:()=>null,caption:false,
  prompt(ctx){
    if(ctx.state==='ready')return{ar:'ده ملخص خطتك. تحب نحفظها للمراجعة؟ الحفظ مش معناه موافقة.',en:'This is your plan summary. Save it for review? Saving does not mean approval.'};
    if(ctx.state==='saving')return{ar:'بحفظ…',en:'Saving…'};
    if(ctx.state==='saved')return TAKEAWAY;
    if(ctx.state==='failed')return{ar:'الخطة ماتحفظتش. جرّب تاني.',en:'The plan was not saved. Try again.'};
    if(ctx.state==='superseded')return{ar:'غيّرت حاجة بعد الحفظ. احفظ تاني.',en:'You changed something after saving. Save again.'};
  },
  render(ctx){
    const L=ctx.locale,st=ctx.state;
    // One idea per screen: the four crops, the one problem, one action. Details are spoken or behind the engineer view.
    const cards=PLAN.map(p=>p.crop==='maize'?p:{crop:p.crop,iso:p.iso,kind:p.kind});
    const head=`<div class="alt-head"><h2 class="question" style="font-size:24px">${L==='ar'?'ملخص خطتك':'Your plan'}</h2><button class="hear" data-act="takeaway" aria-label="${L==='ar'?'اسمع الملخص':'Hear the summary'}">${icon('speaker')}</button></div>`;
    const problem=`<div class="banner rejected">${icon('reject')}<span>${L==='ar'?'مشكلة واحدة: ميعاد الذرة':'One problem: the maize date'}</span></div>`;
    const end={
      ready:`<button class="primary wide-btn" data-act="save">${icon('save')}${L==='ar'?'احفظ للمراجعة':'Save for review'}</button>`,
      saving:`<button class="primary wide-btn" disabled>${icon('save')}${L==='ar'?'بيتحفظ…':'Saving…'}</button>`,
      saved:`<div class="banner saved">${icon('check')}<span>${L==='ar'?'اتحفظت للمراجعة':'Saved for review'}</span></div>`,
      failed:`<div class="banner unknown">${icon('reject')}<span>${L==='ar'?'ماتحفظتش':'Not saved'}</span></div><button class="primary wide-btn" data-act="save">${icon('repeat')}${L==='ar'?'جرّب تاني':'Try again'}</button>`,
      superseded:`<div class="banner review">${icon('review')}<span>${L==='ar'?'المحفوظ لخطة قديمة':'Saved copy is out of date'}</span></div><button class="primary wide-btn" data-act="save">${icon('save')}${L==='ar'?'احفظ الجديدة':'Save the new one'}</button>`
    }[st];
    return `<div class="calm">${head}${Lab.strip(ctx,cards,{cls:'in compact'})}${problem}<div class="calm-end">${end}</div></div>`;
  },
  utterances(ctx){
    if(ctx.state==='ready')return[{label:'Clear save intent',say:{ar:'احفظها',en:'Save it'},effect(ctx){ctx.go('saving');setTimeout(()=>{if(ctx.state==='saving')ctx.go('saved');},1200);}},{label:'Asks to approve (not allowed)',say:{ar:'وافق على الخطة',en:'Approve the plan'},effect(){return{ar:'مقدرش أوافق على خطة فيها تعارض. أقدر أحفظها للمراجعة.',en:'I cannot approve a plan with a conflict. I can save it for review.'};}}];
    return[];
  },
  action(a,b,ctx){
    if(a==='save'){ctx.go('saving');setTimeout(()=>{if(ctx.state==='saving')ctx.go('saved');},1200);return null;}
    if(a==='takeaway')return TAKEAWAY;
    if(a==='details')return{ar:'التفاصيل الكاملة للمهندس الزراعي: المصادر والقواعد والإصدار.',en:'Full details for the extension engineer: sources, rules and version.'};
  },
  notes:[
    'Rebuilt twice on 13 Nov (feedback: crowded). One idea per screen: the four crops, the one problem, one action. Locks, review dates and assumptions are spoken and kept in the engineer details, not printed here.',
    'Plan status (the problem line) and save status (the button, then the saved line) are still separate: a saved plan still has its problem.',
    'The spoken summary is the UH-001 template for this exact version. After any change, old audio stops and the screen says the saved copy is old.',
    '“Approve” does not exist for a rejected plan, by voice or touch.',
    'Engineer details (sources, rules, assumptions, version) sit behind one button, not on the farmer screen.',
    'Save success is simulated with a timer. The real app says “saved” only after the server confirms.'
  ]
};
Lab.page(def);
})();
</script>
</body>
</html>
