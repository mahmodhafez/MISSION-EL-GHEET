# Supply-chain rules for every pip command run with PIP_CONFIG_FILE=backend/pip.conf
# (the backend venv also copies this file to .venv/pip.conf so it applies automatically).
[global]
# Never install a release younger than 14 days (pip >= 26.2; older pip ignores it, so the lock is pinned + hashed too).
uploaded-prior-to = P14D
# Wheels only: no package build scripts run on install.
only-binary = :all:
[install]
require-hashes = true
